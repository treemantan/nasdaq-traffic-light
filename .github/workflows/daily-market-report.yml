name: Macro Regime Radar

concurrency:
  group: macro-regime-radar-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # GitHub cron is UTC and does not support Europe/London directly.
    # Each UK target time has two UTC candidates. The Resolve email mode step
    # keeps only the candidate that maps to the intended UK wall-clock time.
    # UK DST rule, per GOV.UK: clocks go forward at 01:00 GMT on the last Sunday
    # in March, and back at 02:00 BST on the last Sunday in October.
    - cron: "30 7 * * 1-5"   # 08:30 UK when BST (UTC+1), London ETF open pulse
    - cron: "30 8 * * 1-5"   # 08:30 UK when GMT (UTC+0), London ETF open pulse
    - cron: "45 13 * * 1-5"  # 14:45 UK when BST
    - cron: "45 14 * * 1-5"  # 14:45 UK when GMT
    - cron: "0 17 * * 1-5"   # 18:00 UK when BST
    - cron: "0 18 * * 1-5"   # 18:00 UK when GMT
    - cron: "15 20 * * 1-5"  # 21:15 UK when BST
    - cron: "15 21 * * 1-5"  # 21:15 UK when GMT
    - cron: "45 20 * * 1-5"  # 21:45 UK full-email backup when BST
    - cron: "45 21 * * 1-5"  # 21:45 UK full-email backup when GMT
    - cron: "15 22 * * 1-5"  # 22:15 UK full-email backup when GMT
  workflow_dispatch:
    inputs:
      email_mode:
        description: "Email mode: none, pulse, volatility, full, auto"
        required: false
        default: "full"

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve email mode
        id: email-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_EMAIL_MODE: ${{ inputs.email_mode }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time, timezone, timedelta
          from zoneinfo import ZoneInfo

          def emit(mode, should_run, notice, target_date=""):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"email_mode={mode}\n")
                  output.write(f"should_run={'true' if should_run else 'false'}\n")
                  output.write(f"target_date={target_date}\n")
                  output.write(f"notice={notice}\n")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"EMAIL_MODE={mode}\n")
                  env.write(f"SHOULD_RUN={'true' if should_run else 'false'}\n")
                  if target_date:
                      env.write(f"TARGET_UK_DATE={target_date}\n")
              print(notice)

          valid_modes = {"none", "pulse", "volatility", "full", "auto"}
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              mode = os.environ.get("DISPATCH_EMAIL_MODE") or "full"
              if mode not in valid_modes:
                  raise SystemExit(f"Invalid email_mode: {mode}")
              emit(mode, True, f"manual run, EMAIL_MODE={mode}", datetime.now(ZoneInfo("Europe/London")).date().isoformat())
              raise SystemExit(0)

          schedule = os.environ["EVENT_SCHEDULE"]
          mapping = {
              "30 7 * * 1-5": [("08:30", "pulse")],
              "30 8 * * 1-5": [("08:30", "pulse")],
              "45 13 * * 1-5": [("14:45", "pulse")],
              "45 14 * * 1-5": [("14:45", "pulse")],
              "0 17 * * 1-5": [("18:00", "volatility")],
              "0 18 * * 1-5": [("18:00", "volatility")],
              "15 20 * * 1-5": [("21:15", "full")],
              # In GMT this is the primary 21:15 full run; in BST the same UTC
              # slot is a 22:15 backup. The send-marker cache prevents duplicates.
              "15 21 * * 1-5": [("21:15", "full"), ("22:15", "full")],
              "45 20 * * 1-5": [("21:45", "full")],
              "45 21 * * 1-5": [("21:45", "full"), ("22:45", "full")],
              "15 22 * * 1-5": [("22:15", "full")],
          }
          if schedule not in mapping:
              emit("auto", True, "unknown schedule, fallback to auto")
              raise SystemExit(0)

          london = ZoneInfo("Europe/London")
          now_london = datetime.now(london)
          cron_minute, cron_hour = [int(part) for part in schedule.split()[:2]]

          selected = None
          considered = []
          for target_hhmm, candidate_mode in mapping[schedule]:
              hour, minute = [int(part) for part in target_hhmm.split(":")]
              target_london = datetime.combine(now_london.date(), time(hour, minute), london)
              if (target_london - now_london).total_seconds() > 12 * 60 * 60:
                  target_london = target_london - timedelta(days=1)
              target_utc = target_london.astimezone(timezone.utc)
              correct_dst_candidate = target_utc.hour == cron_hour and target_utc.minute == cron_minute
              delay_minutes = abs((now_london - target_london).total_seconds()) / 60
              considered.append(
                  f"{target_hhmm}/{candidate_mode}:expected_utc={target_utc:%H:%M},"
                  + f"delay={delay_minutes:.1f},dst={correct_dst_candidate}"
              )
              if correct_dst_candidate:
                  selected = (target_hhmm, candidate_mode, target_utc, delay_minutes)
                  break

          if selected is None:
              emit(
                  mapping[schedule][0][1],
                  False,
                  f"schedule={schedule}, no matching UK target for DST/GMT; considered={' | '.join(considered)}",
              )
              raise SystemExit(0)

          target_hhmm, mode, target_utc, delay_minutes = selected
          target_date = target_utc.astimezone(london).date().isoformat()

          emit(
              mode,
              True,
              f"schedule={schedule}, target_uk={target_hhmm}, "
              + f"expected_utc={target_utc:%H:%M}, "
              + f"delay_minutes={delay_minutes:.1f}, "
              + "run=True",
              target_date,
          )
          PY

      - name: Resolve report date
        id: report-date
        if: steps.email-mode.outputs.should_run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          report_date = os.environ.get("TARGET_UK_DATE") or datetime.now(ZoneInfo("Europe/London")).date().isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"report_date={report_date}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"REPORT_LOCAL_DATE={report_date}\n")
          print(f"REPORT_LOCAL_DATE={report_date}")
          PY

      - name: Restore full-email send marker
        id: full-email-marker
        if: steps.email-mode.outputs.should_run == 'true' && steps.email-mode.outputs.email_mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: output/email-markers
          key: market-report-email-sent-${{ runner.os }}-${{ steps.report-date.outputs.report_date }}-full

      - name: Install dependencies
        if: steps.email-mode.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Restore report cache
        if: steps.email-mode.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/cache
          key: market-report-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-report-cache-${{ runner.os }}-

      - name: Import latest portfolio statements from OneDrive
        if: steps.email-mode.outputs.should_run == 'true'
        shell: bash
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_USER_ID: ${{ secrets.ONEDRIVE_USER_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          ONEDRIVE_FOLDER_PATH: ${{ vars.ONEDRIVE_FOLDER_PATH }}
          ONEDRIVE_IBKR_FOLDER_PATH: ${{ vars.ONEDRIVE_IBKR_FOLDER_PATH }}
          ONEDRIVE_USE_LATEST_PER_ACCOUNT_FOLDER: ${{ vars.ONEDRIVE_USE_LATEST_PER_ACCOUNT_FOLDER }}
        run: |
          if [ -z "$ONEDRIVE_CLIENT_ID" ]; then
            echo "OneDrive cloud portfolio import is not configured; generating the market report without portfolio.csv."
            exit 0
          fi
          python scripts/download_onedrive_statements.py --output-dir .cloud-statements --import-portfolio

      - name: Generate report
        if: steps.email-mode.outputs.should_run == 'true'
        run: python -m market_report --config config.example.json --dry-run

      - name: Send due private portfolio event reminders
        if: steps.email-mode.outputs.should_run == 'true'
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          PORTFOLIO_EMAIL_TO: ${{ secrets.PORTFOLIO_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python scripts/send_portfolio_event_reminders.py --lookahead-hours 7

      - name: Save report cache
        if: steps.email-mode.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: output/cache
          key: market-report-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload report artifact
        if: steps.email-mode.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}-${{ steps.email-mode.outputs.email_mode }}
          path: |
            output/*.html
            output/*.json
            output/cache/*.json
          if-no-files-found: error

      - name: Send report email
        id: send-report-email
        if: steps.email-mode.outputs.should_run == 'true'
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_MODE: ${{ steps.email-mode.outputs.email_mode }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          PORTFOLIO_EMAIL_TO: ${{ secrets.PORTFOLIO_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$EMAIL_MODE" = "full" ] && [ "${{ steps.full-email-marker.outputs.cache-hit }}" = "true" ]; then
            echo "Full report email already sent for ${REPORT_LOCAL_DATE}; skipping duplicate full email."
            exit 0
          fi
          python scripts/send_cloud_report_email.py

      - name: Mark full report email sent
        if: steps.email-mode.outputs.should_run == 'true' && steps.email-mode.outputs.email_mode == 'full' && steps.full-email-marker.outputs.cache-hit != 'true' && steps.send-report-email.outcome == 'success'
        shell: bash
        run: |
          mkdir -p output/email-markers
          printf 'sent_at=%s\nrun_id=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.run_id }}" > "output/email-markers/${REPORT_LOCAL_DATE}-full.txt"

      - name: Save full-email send marker
        if: steps.email-mode.outputs.should_run == 'true' && steps.email-mode.outputs.email_mode == 'full' && steps.full-email-marker.outputs.cache-hit != 'true' && steps.send-report-email.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: output/email-markers
          key: market-report-email-sent-${{ runner.os }}-${{ steps.report-date.outputs.report_date }}-full
